name: Probe arXiv egress

on:
  workflow_dispatch:
  push:
    branches: [probe2-arxiv]

permissions: {}

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            printf "try %s | " "$i"
            curl -s -o /dev/null -w "export=%{http_code} " "https://export.arxiv.org/api/query?search_query=all:electron&max_results=1"
            python3 - <<'PY'
          import urllib.error, urllib.request
          req = urllib.request.Request(
              "https://export.arxiv.org/api/query?search_query=all:electron&max_results=1",
              headers={"User-Agent": "secpapers/1.0 (+https://github.com/turenlabs/secpapers)"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  r.read(64)
                  print("urllib=200")
          except urllib.error.HTTPError as e:
              print(f"urllib={e.code}")
          except Exception as e:
              print(f"urllib={type(e).__name__}")
          PY
            sleep 2
          done
