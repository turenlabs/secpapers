name: Update papers

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      max_results:
        description: Number of recent arXiv matches to inspect
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Test collector
        run: python3 -m unittest discover -s tests -v

      - name: Collect and render papers
        env:
          MAX_RESULTS: ${{ inputs.max_results || '500' }}
        run: python3 scripts/collect.py --max-results "$MAX_RESULTS"

      - name: Validate generated data
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/collect.py --render-only
          git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No paper changes found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md papers.md data/papers.json data/papers.csv
          git commit -m "chore(data): update arXiv papers"
          git pull --rebase origin main
          git push origin HEAD:main
